# Configure plan enumeration pruning.
# ---- Multi-objective optimizer: (latency, monetary) -------------------------------------------------------
# ParetoPruningStrategy keeps a (1+ε)-approximate Pareto set of partial plans per interface group.
# LatentOperatorPruningStrategy is the scalar original; with objectives.vector=true it delegates to the Pareto prune.
wayang.core.optimizer.pruning.strategies = org.apache.wayang.core.optimizer.enumeration.ParetoPruningStrategy
# wayang.core.optimizer.pruning.strategies = org.apache.wayang.core.optimizer.enumeration.LatentOperatorPruningStrategy
# wayang.core.optimizer.pruning.strategies = org.apache.wayang.core.optimizer.enumeration.TopKPruningStrategy
# wayang.core.optimizer.pruning.topk = 5
# vector = VectorEstimatableCost: latency = Σ E[time] + start-up; monetary = Σ rate·E[time] + fix + rate·start-up,
# with rate/fix from wayang.<platform>.costs.per-ms / costs.fix. "default" = Wayang's scalar cost model.
wayang.core.optimizer.cost.model = vector
# How each operator's time/cost interval becomes one number before summing.
# squash: Wayang's cost squasher (geometric mean) -> monetary axis == Wayang's scalar cost, so with no bounds the
#         pick reproduces original Wayang (weights (0,1), or any weights when all platform rates are equal).
# mean:   expected value (midpoint) of each interval.
wayang.core.optimizer.objectives.estimate = squash
wayang.core.optimizer.objectives.vector = true
# Target approximation: the final front is within a factor (1+epsilon) of the exact one. 0 = exact Pareto.
wayang.core.optimizer.objectives.epsilon = 0.1
# global: split epsilon over all prunes, (1+ε_step)^k = 1+ε (k = #top-level operators, or epsilon.steps).
# per-step: apply epsilon at every prune (smaller fronts, but the error compounds to (1+ε)^k).
wayang.core.optimizer.objectives.epsilon.mode = global
# wayang.core.optimizer.objectives.epsilon.steps = 20
# Optional hard bounds for the final pick: monetary <= budget, latency (ms) <= deadline.
# wayang.core.optimizer.objectives.budget = 1000
# wayang.core.optimizer.objectives.deadline = 60000
# Drop partial plans that already break a bound (safe: costs only grow as plans are extended).
wayang.core.optimizer.objectives.prune.constraints = true
# Final pick among feasible plans. (1,0) = fastest, (0,1) = cheapest, both > 0 = weighted sum.
wayang.core.optimizer.objectives.weight.latency = 1
wayang.core.optimizer.objectives.weight.monetary = 0
# Divide each objective by its best value on the front before weighting, so weights are unit-free.
wayang.core.optimizer.objectives.weight.normalize = true
# single: one cheapest channel conversion per boundary (Wayang default).
# dual: also keep the fastest conversion when it differs, so the trade-off survives platform switches.
wayang.core.optimizer.objectives.junctions = single
# Optional CSV that every final Pareto front is appended to (for plotting).
# wayang.core.optimizer.objectives.front.file = /tmp/wayang-pareto-front.csv
# wayang.core.optimizer.channels.selection = org.apache.wayang.core.optimizer.channels.ChannelConversionGraph$CostbasedTreeSelectionStrategy
# wayang.core.optimizer.instrumentation = org.apache.wayang.core.profiling.OutboundInstrumentationStrategy
wayang.core.optimizer.enumeration.concatenationprio = plans2
wayang.core.optimizer.enumeration.invertconcatenations = false
wayang.core.optimizer.enumeration.branchesfirst = false

# Configure statistics collection.
wayang.core.log.enabled = false
# wayang.core.log.cardinalities = ~/.wayang/cardinalities.json
# wayang.core.log.executions = ~/.wayang/executions.json
wayang.core.explain.enabled = false
wayang.core.explain.directrory = ~/.wayang/

# Configure re-optimization.
wayang.core.optimizer.reoptimize = false
wayang.core.optimizer.reoptimize.proactive = false
wayang.core.optimizer.cardinality.maxspread = 10
wayang.core.optimizer.cardinality.spreadsmoothing = 10000
wayang.core.optimizer.cardinality.minconfidence = 0.5

# Settings for aggressive re-optimization.
#wayang.core.optimizer.instrumentation = org.apache.wayang.core.profiling.FullInstrumentationStrategy
#wayang.core.optimizer.reoptimize = true
#wayang.core.optimizer.reoptimize.proactive = true
#wayang.core.optimizer.cardinality.maxspread = 1
#wayang.core.optimizer.cardinality.spreadsmoothing = 1
#wayang.core.optimizer.cardinality.minconfidence = 1

# Configure fallback estimates.
wayang.core.fallback.udf.cpu.lower = 100
wayang.core.fallback.udf.cpu.upper = 1000
wayang.core.fallback.udf.cpu.confidence = 0.2
wayang.core.fallback.udf.ram.lower = 100
wayang.core.fallback.udf.ram.upper = 1000
wayang.core.fallback.udf.ram.confidence = 0.2
wayang.core.fallback.operator.cpu.lower = 100
wayang.core.fallback.operator.cpu.upper = 1000
wayang.core.fallback.operator.cpu.confidence = 0.2
wayang.core.fallback.operator.ram.lower = 100
wayang.core.fallback.operator.ram.upper = 1000
wayang.core.fallback.operator.ram.confidence = 0.2

# Configure Monitor.
wayang.core.monitor.enabled = false

# Configure parallelism.
wayang.core.optimizer.enumeration.parallel-tasks = false


